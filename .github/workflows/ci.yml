name: CI

# 能力边界（重要，勿删）：本 CI 只做「结构校验」——
#   1. SKILL.md frontmatter 必填字段是否存在；
#   2. README 内部链接是否指向真实文件；
#   3. tests/samples 下每个样例的 expected_retake_note 是否含诊断 / 可复制指令 / 约束三要素。
# 它通过 ≠ 重拍单质量合格：包含围栏、约束关键词、原始指令与已知负例检查，不证明语义正确。
# 质量判定请用 references/优化与检查指令自查rubric.md（赶时间只过「Must-have 精简版 18 条」）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run validation suite
        run: python tests/validate.py all
      - name: Test public file boundaries
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify current published Release install
        env:
          INSTALL_DEST: ${{ runner.temp }}/second-take-release-check
        run: |
          VERSION="$(sed -n -E 's/^[[:space:]]*version:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' SKILL.md | head -n 1)"
          test -n "$VERSION"
          echo "verifying published release for v$VERSION"
          bash install.sh --version "$VERSION" "$INSTALL_DEST"
          grep -Eq "version: \"?$VERSION\"?" "$INSTALL_DEST/SKILL.md"

  publish:
    # Publishing requires a deliberate versioned commit on main and passing tests.
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v') }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish versioned Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${COMMIT_MESSAGE%%$'\n'*}"
          VERSION="${VERSION#release: v}"
          bash scripts/release.sh "$VERSION" --repo "$GITHUB_REPOSITORY"
      - name: Verify live Release and installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${COMMIT_MESSAGE%%$'\n'*}"
          VERSION="${VERSION#release: v}"
          TAG="v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | grep -Fx 'second-take-latest.zip'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          bash install.sh --version "$VERSION" "$RUNNER_TEMP/second-take-versioned"
          bash update.sh "$RUNNER_TEMP/second-take-current"
          for dest in "$RUNNER_TEMP/second-take-versioned" "$RUNNER_TEMP/second-take-current"; do
            grep -Eq "version: \"?$VERSION\"?" "$dest/SKILL.md"
          done

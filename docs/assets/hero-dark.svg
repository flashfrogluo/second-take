<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 470" width="960" height="470" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#0e1822"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="72%">
      <stop offset="0" stop-color="#2bb6a8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2bb6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="960" height="470" fill="url(#bg)"/>
  <rect width="960" height="470" fill="url(#glow)"/>
  <rect x="0" y="0" width="960" height="2" fill="#2bb6a8" opacity="0.6"/>

  <!-- title -->
  <text x="50" y="46" fill="#f2f6f9" font-size="25" font-weight="800" letter-spacing="0.5">Second Take · 再来一条</text>
  <!-- capability / outcome pill -->
  <rect x="636" y="22" width="274" height="40" rx="13" fill="#13202b" stroke="#2bb6a8" stroke-width="1.2"/>
  <text x="773" y="40" text-anchor="middle" fill="#7fe0d2" font-size="12.5" font-weight="700">诊断 + 重拍，产出更好的 AI 成果</text>
  <text x="773" y="56" text-anchor="middle" fill="#5b8c86" font-size="9.5">Diagnose &amp; re-shoot — better AI output</text>

  <text x="50" y="72" fill="#e7eef4" font-size="14">主攻 AI 的思考过程，从而优化最终产出</text>
  <text x="50" y="91" fill="#8fa0ad" font-size="11.5">Fix the thinking process to optimize the result</text>
  <line x1="50" y1="104" x2="910" y2="104" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ===== main flow (bilingual) ===== -->
  <!-- node 1 -->
  <g transform="translate(61,116)">
    <rect width="250" height="196" rx="14" fill="#141d27" stroke="#64748b" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="0" y="14" width="4" height="168" rx="2" fill="#64748b"/>
    <circle cx="42" cy="42" r="17" fill="#64748b"/>
    <text x="42" y="48" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
    <text x="72" y="38" fill="#eef3f7" font-size="15" font-weight="700">待改善的 AI 成果</text>
    <text x="72" y="57" fill="#9fb0bd" font-size="11">Your AI's output to improve</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#64748b" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" fill="#cdd8e0" font-size="12.5">AI 深度思考过程 + 当前回答</text>
    <text x="20" y="123" fill="#7e8e9b" font-size="10.5">AI thinking + its current reply</text>
    <text x="20" y="150" fill="#cdd8e0" font-size="12.5">没达到预期，交来一起诊断</text>
    <text x="20" y="169" fill="#7e8e9b" font-size="10.5">Below par? Bring it in to diagnose</text>
  </g>

  <!-- arrow 1 -->
  <g stroke="#5b6b78" fill="#5b6b78">
    <line x1="318" y1="214" x2="342" y2="214" stroke-width="2"/>
    <path d="M342 209 L352 214 L342 219 Z"/>
  </g>

  <!-- node 2 -->
  <g transform="translate(355,116)">
    <rect width="250" height="196" rx="14" fill="#141d27" stroke="#0d9f6e" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="0" y="14" width="4" height="168" rx="2" fill="#0d9f6e"/>
    <circle cx="42" cy="42" r="17" fill="#0d9f6e"/>
    <text x="42" y="48" text-anchor="middle" fill="#1a1405" font-size="16" font-weight="800">2</text>
    <text x="72" y="38" fill="#eef3f7" font-size="15" font-weight="700">重拍单</text>
    <text x="72" y="57" fill="#9fb0bd" font-size="11">Retake note</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#0d9f6e" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" fill="#cdd8e0" font-size="12.5">诊断问题 + 可复制优化指令</text>
    <text x="20" y="123" fill="#7e8e9b" font-size="10.5">Diagnosis + copy-paste fix note</text>
    <text x="20" y="150" fill="#cdd8e0" font-size="12.5">粘回原 AI 即重拍</text>
    <text x="20" y="169" fill="#7e8e9b" font-size="10.5">Paste back to your AI to re-shoot</text>
  </g>

  <!-- arrow 2 -->
  <g stroke="#5b6b78" fill="#5b6b78">
    <line x1="612" y1="214" x2="636" y2="214" stroke-width="2"/>
    <path d="M636 209 L646 214 L636 219 Z"/>
  </g>

  <!-- node 3 -->
  <g transform="translate(649,116)">
    <rect width="250" height="196" rx="14" fill="#141d27" stroke="#7c5cbf" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="0" y="14" width="4" height="168" rx="2" fill="#7c5cbf"/>
    <circle cx="42" cy="42" r="17" fill="#7c5cbf"/>
    <text x="42" y="48" text-anchor="middle" fill="#06201d" font-size="16" font-weight="800">3</text>
    <text x="72" y="38" fill="#eef3f7" font-size="15" font-weight="700">更好的 AI 产出</text>
    <text x="72" y="57" fill="#9fb0bd" font-size="11">Better AI output</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#2bb6a8" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" fill="#cdd8e0" font-size="12.5">更可靠、更贴合你的需求</text>
    <text x="20" y="123" fill="#7e8e9b" font-size="10.5">More reliable, fits your needs</text>
    <text x="20" y="150" fill="#cdd8e0" font-size="12.5">真正能用，而非堆满术语</text>
    <text x="20" y="169" fill="#7e8e9b" font-size="10.5">Usable, not jargon-stuffed</text>
  </g>

  <!-- ===== five modes (abbreviated, smaller) ===== -->
  <text x="50" y="332" fill="#93a3af" font-size="11.5" font-weight="700">五种模式 · Five modes</text>
  <line x1="50" y1="342" x2="910" y2="342" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- mode chips -->
  <g transform="translate(50,350)">
    <rect width="161" height="76" rx="9" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#1a0a0a" font-size="11" font-weight="800">1</text>
    <text x="38" y="19" fill="#e6edf2" font-size="12.5" font-weight="700">重拍</text>
    <text x="38" y="35" fill="#8fa0ad" font-size="9.5">Reshoot</text>
    <text x="14" y="60" fill="#b6c2cc" font-size="10">主体不成立，整条重写</text>
  </g>
  <g transform="translate(225,350)">
    <rect width="161" height="76" rx="9" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#1a1405" font-size="11" font-weight="800">2</text>
    <text x="38" y="19" fill="#e6edf2" font-size="12.5" font-weight="700">补拍</text>
    <text x="38" y="35" fill="#8fa0ad" font-size="9.5">Pick-up</text>
    <text x="14" y="60" fill="#b6c2cc" font-size="10">主体已成立，定点修</text>
  </g>
  <g transform="translate(400,350)">
    <rect width="161" height="76" rx="9" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#06201d" font-size="11" font-weight="800">3</text>
    <text x="38" y="19" fill="#e6edf2" font-size="12.5" font-weight="700">定剪</text>
    <text x="38" y="35" fill="#8fa0ad" font-size="9.5">Final cut</text>
    <text x="14" y="60" fill="#b6c2cc" font-size="10">多轮僵持，做取舍</text>
  </g>
  <g transform="translate(575,350)">
    <rect width="161" height="76" rx="9" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#1a0a04" font-size="11" font-weight="800">4</text>
    <text x="38" y="19" fill="#e6edf2" font-size="12.5" font-weight="700">调色</text>
    <text x="38" y="35" fill="#8fa0ad" font-size="9.5">Color grading</text>
    <text x="14" y="60" fill="#b6c2cc" font-size="10">主体已优，润色表达与视觉</text>
  </g>
  <g transform="translate(750,350)">
    <rect width="161" height="76" rx="9" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#06203a" font-size="11" font-weight="800">5</text>
    <text x="38" y="19" fill="#e6edf2" font-size="12.5" font-weight="700">包装</text>
    <text x="38" y="35" fill="#8fa0ad" font-size="9.5">Packaging</text>
    <text x="14" y="60" fill="#b6c2cc" font-size="10">交付时，可视化呈现</text>
  </g>

  <!-- author watermark + repo (clickable) -->
  <text x="480" y="452" text-anchor="middle" fill="#67747f" font-size="11" letter-spacing="1">© flashfrogluo · Second Take</text>
  <a xlink:href="https://github.com/flashfrogluo/second-take" href="https://github.com/flashfrogluo/second-take">
    <text x="910" y="452" text-anchor="end" fill="#6f9aa6" font-size="10">github.com/flashfrogluo/second-take</text>
    <line x1="730" y1="456" x2="910" y2="456" stroke="#6f9aa6" stroke-width="0.6" opacity="0.7"/>
  </a>
</svg>

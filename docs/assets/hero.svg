<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 470" width="960" height="470" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<style>
  /* 默认（深色）：见 :root；系统浅色时覆盖 */
  :root{--k1:#0b1118;--k2:#0e1822;--k3:#000;--k4:0.40;--k5:#f2f6f9;--k6:#13202b;--k7:#e7eef4;--k8:#8fa0ad;--k9:#ffffff;--k10:0.07;--k11:#141d27;--k12:#eef3f7;--k13:#9fb0bd;--k14:#cdd8e0;--k15:#7e8e9b;--k16:#cdd8e0;--k17:#7e8e9b;--k18:#5b6b78;--k19:#141d27;--k20:#eef3f7;--k21:#9fb0bd;--k22:#cdd8e0;--k23:#7e8e9b;--k24:#cdd8e0;--k25:#7e8e9b;--k26:#5b6b78;--k27:#141d27;--k28:#eef3f7;--k29:#9fb0bd;--k30:#cdd8e0;--k31:#7e8e9b;--k32:#cdd8e0;--k33:#7e8e9b;--k34:#93a3af;--k35:#121c26;--k36:#e6edf2;--k37:#8fa0ad;--k38:#b6c2cc;--k39:#121c26;--k40:#e6edf2;--k41:#8fa0ad;--k42:#b6c2cc;--k43:#121c26;--k44:#e6edf2;--k45:#8fa0ad;--k46:#b6c2cc;--k47:#121c26;--k48:#e6edf2;--k49:#8fa0ad;--k50:#b6c2cc;--k51:#121c26;--k52:#e6edf2;--k53:#8fa0ad;--k54:#b6c2cc;--k55:#67747f;--k56:#6f9aa6;--k57:normal}
  @media (prefers-color-scheme: light){
    :root{--k1:#f7fafc;--k2:#eef4f8;--k3:#0f1720;--k4:0.10;--k5:#0f1720;--k6:#ffffff;--k7:#1f2b38;--k8:#5b6b7c;--k9:#0f1720;--k10:0.10;--k11:#ffffff;--k12:#0f1720;--k13:#5b6b7c;--k14:#33414f;--k15:#5b6b7c;--k16:#33414f;--k17:#5b6b7c;--k18:#5b6b7c;--k19:#ffffff;--k20:#0f1720;--k21:#5b6b7c;--k22:#33414f;--k23:#5b6b7c;--k24:#33414f;--k25:#5b6b7c;--k26:#5b6b7c;--k27:#ffffff;--k28:#0f1720;--k29:#5b6b7c;--k30:#33414f;--k31:#5b6b7c;--k32:#33414f;--k33:#5b6b7c;--k34:#5b6b7c;--k35:#ffffff;--k36:#243040;--k37:#5b6b7c;--k38:#4a5a6b;--k39:#ffffff;--k40:#243040;--k41:#5b6b7c;--k42:#4a5a6b;--k43:#ffffff;--k44:#243040;--k45:#5b6b7c;--k46:#4a5a6b;--k47:#ffffff;--k48:#243040;--k49:#5b6b7c;--k50:#4a5a6b;--k51:#ffffff;--k52:#243040;--k53:#5b6b7c;--k54:#4a5a6b;--k55:#5b6b7c;--k56:#0a7d57;--k57:600}
  }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--k1)" />
      <stop offset="1" style="stop-color:var(--k2)" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="72%">
      <stop offset="0" stop-color="#2bb6a8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2bb6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" style="flood-color:var(--k3);flood-opacity:var(--k4)" />
    </filter>
  </defs>

  <!-- background -->
  <rect width="960" height="470" fill="url(#bg)"/>
  <rect width="960" height="470" fill="url(#glow)"/>
  <rect x="0" y="0" width="960" height="2" fill="#2bb6a8" opacity="0.6"/>

  <!-- title -->
  <text x="50" y="46" font-size="25" font-weight="800" letter-spacing="0.5" style="fill:var(--k5)">Second Take · 再来一条</text>
  <!-- capability / outcome pill -->
  <rect x="636" y="22" width="274" height="40" rx="13" stroke="#2bb6a8" stroke-width="1.2" style="fill:var(--k6)" />
  <text x="773" y="40" text-anchor="middle" fill="#7fe0d2" font-size="12.5" font-weight="700">诊断 + 重拍，产出更好的 AI 成果</text>
  <text x="773" y="56" text-anchor="middle" fill="#5b8c86" font-size="9.5">Diagnose &amp; re-shoot — better AI output</text>

  <text x="50" y="72" font-size="14" style="fill:var(--k7)">主攻 AI 的思考过程，从而优化最终产出</text>
  <text x="50" y="91" font-size="11.5" style="fill:var(--k8)">Fix the thinking process to optimize the result</text>
  <line x1="50" y1="104" x2="910" y2="104" stroke-width="1" style="stroke:var(--k9);stroke-opacity:var(--k10)" />

  <!-- ===== main flow (bilingual) ===== -->
  <!-- node 1 -->
  <g transform="translate(61,116)">
    <rect width="250" height="196" rx="14" stroke="#64748b" stroke-width="1.4" filter="url(#shadow)" style="fill:var(--k11)" />
    <rect x="0" y="14" width="4" height="168" rx="2" fill="#64748b"/>
    <circle cx="42" cy="42" r="17" fill="#64748b"/>
    <text x="42" y="48" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
    <text x="72" y="38" font-size="15" font-weight="700" style="fill:var(--k12)">待改善的 AI 成果</text>
    <text x="72" y="57" font-size="11" style="fill:var(--k13)">Your AI's output to improve</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#64748b" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" font-size="12.5" style="fill:var(--k14)">AI 深度思考过程 + 当前回答</text>
    <text x="20" y="123" font-size="10.5" style="fill:var(--k15)">AI thinking + its current reply</text>
    <text x="20" y="150" font-size="12.5" style="fill:var(--k16)">没达到预期，交来一起诊断</text>
    <text x="20" y="169" font-size="10.5" style="fill:var(--k17)">Below par? Bring it in to diagnose</text>
  </g>

  <!-- arrow 1 -->
  <g stroke="#5b6b78" style="fill:var(--k18)">
    <line x1="318" y1="214" x2="342" y2="214" stroke-width="2"/>
    <path d="M342 209 L352 214 L342 219 Z"/>
  </g>

  <!-- node 2 -->
  <g transform="translate(355,116)">
    <rect width="250" height="196" rx="14" stroke="#0d9f6e" stroke-width="1.4" filter="url(#shadow)" style="fill:var(--k19)" />
    <rect x="0" y="14" width="4" height="168" rx="2" fill="#0d9f6e"/>
    <circle cx="42" cy="42" r="17" fill="#0d9f6e"/>
    <text x="42" y="48" text-anchor="middle" fill="#1a1405" font-size="16" font-weight="800">2</text>
    <text x="72" y="38" font-size="15" font-weight="700" style="fill:var(--k20)">重拍单</text>
    <text x="72" y="57" font-size="11" style="fill:var(--k21)">Retake note</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#0d9f6e" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" font-size="12.5" style="fill:var(--k22)">诊断问题 + 可复制优化指令</text>
    <text x="20" y="123" font-size="10.5" style="fill:var(--k23)">Diagnosis + copy-paste fix note</text>
    <text x="20" y="150" font-size="12.5" style="fill:var(--k24)">粘回原 AI 即重拍</text>
    <text x="20" y="169" font-size="10.5" style="fill:var(--k25)">Paste back to your AI to re-shoot</text>
  </g>

  <!-- arrow 2 -->
  <g stroke="#5b6b78" style="fill:var(--k26)">
    <line x1="612" y1="214" x2="636" y2="214" stroke-width="2"/>
    <path d="M636 209 L646 214 L636 219 Z"/>
  </g>

  <!-- node 3 -->
  <g transform="translate(649,116)">
    <rect width="250" height="196" rx="14" stroke="#7c5cbf" stroke-width="1.4" filter="url(#shadow)" style="fill:var(--k27)" />
    <rect x="0" y="14" width="4" height="168" rx="2" fill="#7c5cbf"/>
    <circle cx="42" cy="42" r="17" fill="#7c5cbf"/>
    <text x="42" y="48" text-anchor="middle" fill="#06201d" font-size="16" font-weight="800">3</text>
    <text x="72" y="38" font-size="15" font-weight="700" style="fill:var(--k28)">更好的 AI 产出</text>
    <text x="72" y="57" font-size="11" style="fill:var(--k29)">Better AI output</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#2bb6a8" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" font-size="12.5" style="fill:var(--k30)">更可靠、更贴合你的需求</text>
    <text x="20" y="123" font-size="10.5" style="fill:var(--k31)">More reliable, fits your needs</text>
    <text x="20" y="150" font-size="12.5" style="fill:var(--k32)">真正能用，而非堆满术语</text>
    <text x="20" y="169" font-size="10.5" style="fill:var(--k33)">Usable, not jargon-stuffed</text>
  </g>

  <!-- ===== five modes (abbreviated, smaller) ===== -->
  <text x="50" y="332" font-size="11.5" font-weight="700" style="fill:var(--k34)">五种模式 · Five modes</text>
  <line x1="50" y1="342" x2="910" y2="342" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- mode chips -->
  <g transform="translate(50,350)">
    <rect width="161" height="76" rx="9" stroke="#243240" stroke-width="1" style="fill:var(--k35)" />
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#1a0a0a" font-size="11" font-weight="800">1</text>
    <text x="38" y="19" font-size="12.5" font-weight="700" style="fill:var(--k36)">重拍</text>
    <text x="38" y="35" font-size="9.5" style="fill:var(--k37)">Reshoot</text>
    <text x="14" y="60" font-size="10" style="fill:var(--k38)">主体不成立，整条重写</text>
  </g>
  <g transform="translate(225,350)">
    <rect width="161" height="76" rx="9" stroke="#243240" stroke-width="1" style="fill:var(--k39)" />
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#1a1405" font-size="11" font-weight="800">2</text>
    <text x="38" y="19" font-size="12.5" font-weight="700" style="fill:var(--k40)">补拍</text>
    <text x="38" y="35" font-size="9.5" style="fill:var(--k41)">Pick-up</text>
    <text x="14" y="60" font-size="10" style="fill:var(--k42)">主体已成立，定点修</text>
  </g>
  <g transform="translate(400,350)">
    <rect width="161" height="76" rx="9" stroke="#243240" stroke-width="1" style="fill:var(--k43)" />
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#06201d" font-size="11" font-weight="800">3</text>
    <text x="38" y="19" font-size="12.5" font-weight="700" style="fill:var(--k44)">定剪</text>
    <text x="38" y="35" font-size="9.5" style="fill:var(--k45)">Final cut</text>
    <text x="14" y="60" font-size="10" style="fill:var(--k46)">多轮僵持，做取舍</text>
  </g>
  <g transform="translate(575,350)">
    <rect width="161" height="76" rx="9" stroke="#243240" stroke-width="1" style="fill:var(--k47)" />
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#1a0a04" font-size="11" font-weight="800">4</text>
    <text x="38" y="19" font-size="12.5" font-weight="700" style="fill:var(--k48)">调色</text>
    <text x="38" y="35" font-size="9.5" style="fill:var(--k49)">Color grading</text>
    <text x="14" y="60" font-size="10" style="fill:var(--k50)">主体已优，润色表达与视觉</text>
  </g>
  <g transform="translate(750,350)">
    <rect width="161" height="76" rx="9" stroke="#243240" stroke-width="1" style="fill:var(--k51)" />
    <circle cx="20" cy="21" r="11" fill="#0d9f6e"/>
    <text x="20" y="26" text-anchor="middle" fill="#06203a" font-size="11" font-weight="800">5</text>
    <text x="38" y="19" font-size="12.5" font-weight="700" style="fill:var(--k52)">包装</text>
    <text x="38" y="35" font-size="9.5" style="fill:var(--k53)">Packaging</text>
    <text x="14" y="60" font-size="10" style="fill:var(--k54)">交付时，可视化呈现</text>
  </g>

  <!-- author watermark + repo (clickable) -->
  <text x="480" y="452" text-anchor="middle" font-size="11" letter-spacing="1" style="fill:var(--k55)">© flashfrogluo · Second Take</text>
  <a xlink:href="https://github.com/flashfrogluo/second-take" href="https://github.com/flashfrogluo/second-take">
    <text x="910" y="452" text-anchor="end" font-size="10" style="fill:var(--k56);font-weight:var(--k57)">github.com/flashfrogluo/second-take</text>
    <line x1="730" y1="456" x2="910" y2="456" stroke="#6f9aa6" stroke-width="0.6" opacity="0.7"/>
  </a>
</svg>

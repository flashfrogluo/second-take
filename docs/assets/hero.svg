<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#0e1822"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="70%">
      <stop offset="0" stop-color="#2bb6a8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2bb6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="960" height="460" fill="url(#bg)"/>
  <rect width="960" height="460" fill="url(#glow)"/>
  <rect x="0" y="0" width="960" height="2" fill="#2bb6a8" opacity="0.6"/>

  <!-- title -->
  <text x="50" y="48" fill="#f2f6f9" font-size="26" font-weight="800" letter-spacing="0.5">Second Take · 再来一条</text>
  <text x="51" y="72" fill="#9fb0bd" font-size="13">把不满意的深度思考，重拍成更好的答案 · Turn weak reasoning into a better answer</text>
  <text x="910" y="48" text-anchor="end" fill="#6f8290" font-size="12">AI 深度思考质检 · Reasoning QA</text>
  <line x1="50" y1="88" x2="910" y2="88" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ===== main flow ===== -->
  <!-- node 1: input -->
  <g transform="translate(61,110)">
    <rect width="250" height="160" rx="14" fill="#141d27" stroke="#e0584f" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="12" y="16" width="4" height="128" rx="2" fill="#e0584f"/>
    <circle cx="46" cy="46" r="21" fill="#e0584f"/>
    <rect x="39" y="39" width="14" height="14" rx="2.5" fill="#fff" opacity="0.95"/>
    <line x1="42" y1="43" x2="50" y2="43" stroke="#e0584f" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="48" x2="50" y2="48" stroke="#e0584f" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="42" fill="#eef3f7" font-size="15" font-weight="700">待诊断素材</text>
    <text x="80" y="61" fill="#9fb0bd" font-size="11">Material under review</text>
    <line x1="18" y1="82" x2="232" y2="82" stroke="#e0584f" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="114" fill="#cdd8e0" font-size="12">你的 CoT + 最终答案</text>
    <text x="20" y="136" fill="#8595a3" font-size="10">Your reasoning chain + answer</text>
  </g>

  <!-- arrow 1 -->
  <g stroke="#5b6b78" fill="#5b6b78">
    <line x1="318" y1="190" x2="342" y2="190" stroke-width="2"/>
    <path d="M342 185 L352 190 L342 195 Z"/>
  </g>

  <!-- node 2: retake note -->
  <g transform="translate(355,110)">
    <rect width="250" height="160" rx="14" fill="#141d27" stroke="#e8b84b" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="12" y="16" width="4" height="128" rx="2" fill="#e8b84b"/>
    <circle cx="46" cy="46" r="21" fill="#e8b84b"/>
    <path d="M39 50 l5 5 l9 -11" fill="none" stroke="#1a1405" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="42" fill="#eef3f7" font-size="15" font-weight="700">重拍单</text>
    <text x="80" y="61" fill="#9fb0bd" font-size="11">Retake note</text>
    <line x1="18" y1="82" x2="232" y2="82" stroke="#e8b84b" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="114" fill="#cdd8e0" font-size="12">可复制的优化指令</text>
    <text x="20" y="136" fill="#8595a3" font-size="10">Copy-ready optimization instruction</text>
  </g>

  <!-- arrow 2 -->
  <g stroke="#5b6b78" fill="#5b6b78">
    <line x1="612" y1="190" x2="636" y2="190" stroke-width="2"/>
    <path d="M636 185 L646 190 L636 195 Z"/>
  </g>

  <!-- node 3: better answer -->
  <g transform="translate(649,110)">
    <rect width="250" height="160" rx="14" fill="#141d27" stroke="#2bb6a8" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="12" y="16" width="4" height="128" rx="2" fill="#2bb6a8"/>
    <circle cx="46" cy="46" r="21" fill="#2bb6a8"/>
    <path d="M38 50 l5 5 l9 -11" fill="none" stroke="#06201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="42" fill="#eef3f7" font-size="15" font-weight="700">更好的答案</text>
    <text x="80" y="61" fill="#9fb0bd" font-size="11">Better answer</text>
    <line x1="18" y1="82" x2="232" y2="82" stroke="#2bb6a8" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="114" fill="#cdd8e0" font-size="12">四标准达标</text>
    <text x="20" y="136" fill="#8595a3" font-size="10">Meets all Four Standards</text>
  </g>

  <!-- ===== five modes (abbreviated) ===== -->
  <text x="50" y="306" fill="#aebcc8" font-size="12.5" font-weight="700">五种模式 · Five modes</text>
  <line x1="50" y1="316" x2="910" y2="316" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- mode chips -->
  <g transform="translate(50,326)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#e0584f"/>
    <text x="22" y="29" text-anchor="middle" fill="#1a0a0a" font-size="12" font-weight="800">1</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">重拍</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Reshoot</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">主体不成立，整条重写</text>
  </g>
  <g transform="translate(225,326)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#e8b84b"/>
    <text x="22" y="29" text-anchor="middle" fill="#1a1405" font-size="12" font-weight="800">2</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">补拍</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Pick-up</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">主体已成立，定点修</text>
  </g>
  <g transform="translate(400,326)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#2bb6a8"/>
    <text x="22" y="29" text-anchor="middle" fill="#06201d" font-size="12" font-weight="800">3</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">定剪</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Final cut</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">多轮僵持，做取舍</text>
  </g>
  <g transform="translate(575,326)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#e8915a"/>
    <text x="22" y="29" text-anchor="middle" fill="#1a0a04" font-size="12" font-weight="800">4</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">调色</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Color grading</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">已达标，润色风格</text>
  </g>
  <g transform="translate(750,326)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#6aa9e0"/>
    <text x="22" y="29" text-anchor="middle" fill="#06203a" font-size="12" font-weight="800">5</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">包装</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Packaging</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">交付时，可视化呈现</text>
  </g>

  <!-- author watermark -->
  <text x="480" y="450" text-anchor="middle" fill="#67747f" font-size="11" letter-spacing="1">© flashfrogluo · Second Take</text>
</svg>

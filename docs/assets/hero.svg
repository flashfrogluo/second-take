<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#101b24"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1414"/>
      <stop offset="1" stop-color="#5a1f1f"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2410"/>
      <stop offset="1" stop-color="#4a3a16"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a3a"/>
      <stop offset="1" stop-color="#1d4d44"/>
    </linearGradient>
    <linearGradient id="grade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb6a8"/>
      <stop offset="0.55" stop-color="#e8c15a"/>
      <stop offset="1" stop-color="#e8915a"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="960" height="400" fill="url(#bg)"/>
  <!-- cinematic color grade wash -->
  <rect width="960" height="400" fill="url(#grade)" opacity="0.10"/>
  <ellipse cx="480" cy="220" rx="520" ry="200" fill="#e8915a" opacity="0.06" filter="url(#soft)"/>
  <ellipse cx="200" cy="120" rx="320" ry="160" fill="#2bb6a8" opacity="0.06" filter="url(#soft)"/>

  <!-- letterbox bars -->
  <rect x="0" y="0" width="960" height="40" fill="#000"/>
  <rect x="0" y="360" width="960" height="40" fill="#000"/>

  <!-- clapperboard motif (top-left) -->
  <g transform="translate(40,52)">
    <rect x="0" y="14" width="86" height="22" rx="2" fill="#11181f" stroke="#e8eef2" stroke-width="1.5"/>
    <g>
      <polygon points="0,14 14,0 28,14" fill="#e8eef2"/>
      <polygon points="20,14 34,0 48,14" fill="#11181f"/>
      <polygon points="40,14 54,0 68,14" fill="#e8eef2"/>
      <polygon points="60,14 74,0 86,14" fill="#11181f"/>
    </g>
    <line x1="0" y1="14" x2="86" y2="14" stroke="#e8eef2" stroke-width="1.5"/>
    <line x1="84" y1="8" x2="96" y2="20" stroke="#e8eef2" stroke-width="2"/>
  </g>
  <text x="140" y="70" fill="#e8eef2" font-size="22" font-weight="700">Second Take · 再来一条</text>
  <text x="140" y="92" fill="#9fb0bd" font-size="13">把一段不满意的思考，重拍成更好的答案</text>

  <!-- card: bad CoT -->
  <g transform="translate(40,120)">
    <rect width="250" height="180" rx="10" fill="url(#bad)" stroke="#c0392b" stroke-width="1.5"/>
    <text x="18" y="30" fill="#f0c9c9" font-size="14" font-weight="700">坏 CoT · 深度思考</text>
    <line x1="18" y1="42" x2="232" y2="42" stroke="#c0392b" stroke-width="1" opacity="0.5"/>
    <path d="M18 64 H210" stroke="#e07a7a" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M18 84 H170" stroke="#e07a7a" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M18 104 H230" stroke="#e07a7a" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <path d="M18 124 H140" stroke="#e07a7a" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <circle cx="200" cy="150" r="14" fill="none" stroke="#e07a7a" stroke-width="3"/>
    <line x1="190" y1="140" x2="210" y2="160" stroke="#e07a7a" stroke-width="3"/>
    <text x="18" y="166" fill="#e07a7a" font-size="11">漏项 · 矛盾 · 无据引用</text>
  </g>

  <!-- arrow 1 -->
  <g transform="translate(300,200)" fill="#e8c15a">
    <path d="M0 0 H40 L40 -8 L60 10 L40 28 L40 20 H0 Z"/>
  </g>

  <!-- card: retake note -->
  <g transform="translate(355,120)">
    <rect width="250" height="180" rx="10" fill="url(#note)" stroke="#e0a93b" stroke-width="1.5"/>
    <rect x="96" y="22" width="58" height="74" rx="4" fill="#f3e6c4" opacity="0.92"/>
    <line x1="104" y1="36" x2="146" y2="36" stroke="#8a6d2e" stroke-width="3"/>
    <line x1="104" y1="50" x2="146" y2="50" stroke="#8a6d2e" stroke-width="3"/>
    <line x1="104" y1="64" x2="146" y2="64" stroke="#8a6d2e" stroke-width="3"/>
    <line x1="104" y1="78" x2="128" y2="78" stroke="#8a6d2e" stroke-width="3"/>
    <text x="18" y="30" fill="#f3e6c4" font-size="14" font-weight="700">重拍单 · Retake note</text>
    <line x1="18" y1="42" x2="232" y2="42" stroke="#e0a93b" stroke-width="1" opacity="0.5"/>
    <text x="18" y="120" fill="#f3e6c4" font-size="11" opacity="0.9">可复制的优化指令</text>
    <text x="18" y="138" fill="#f3e6c4" font-size="11" opacity="0.9">粘回原对话 → 它直接重答</text>
    <text x="18" y="166" fill="#e0a93b" font-size="11">含四标准 + 检查项结论</text>
  </g>

  <!-- arrow 2 -->
  <g transform="translate(615,200)" fill="#e8915a">
    <path d="M0 0 H40 L40 -8 L60 10 L40 28 L40 20 H0 Z"/>
  </g>

  <!-- card: better answer -->
  <g transform="translate(670,120)">
    <rect width="250" height="180" rx="10" fill="url(#good)" stroke="#2bb6a8" stroke-width="1.5"/>
    <text x="18" y="30" fill="#bfeae3" font-size="14" font-weight="700">更好答案 · Better answer</text>
    <line x1="18" y1="42" x2="232" y2="42" stroke="#2bb6a8" stroke-width="1" opacity="0.5"/>
    <path d="M18 64 H210" stroke="#bfeae3" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M18 84 H186" stroke="#f0c98a" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M18 104 H230" stroke="#bfeae3" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M18 124 H156" stroke="#f0c98a" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <text x="18" y="166" fill="#2bb6a8" font-size="11">逻辑 / 全面 / 可行 / 可验证 达标</text>
  </g>

  <!-- film grain overlay -->
  <rect width="960" height="400" filter="url(#grain)" opacity="0.05"/>

  <!-- author watermark in bottom letterbox -->
  <text x="480" y="385" text-anchor="middle" fill="#7d8a94" font-size="12" letter-spacing="1">© flashfrogluo · Second Take — AI 深度思考质检与重拍单生成</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#0e1a22"/>
    </linearGradient>
    <linearGradient id="grade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb6a8"/>
      <stop offset="0.55" stop-color="#e8c15a"/>
      <stop offset="1" stop-color="#e8745a"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1a1a"/>
      <stop offset="1" stop-color="#6e2424"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2e12"/>
      <stop offset="1" stop-color="#5c4a1c"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3b38"/>
      <stop offset="1" stop-color="#15554a"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="40%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect width="960" height="420" fill="url(#grade)" opacity="0.08"/>
  <ellipse cx="180" cy="120" rx="340" ry="180" fill="#2bb6a8" opacity="0.05"/>
  <ellipse cx="780" cy="300" rx="360" ry="200" fill="#e8745a" opacity="0.05"/>
  <rect width="960" height="420" fill="url(#vig)"/>

  <!-- letterbox bars -->
  <rect x="0" y="0" width="960" height="30" fill="#000"/>
  <rect x="0" y="390" width="960" height="30" fill="#000"/>
  <rect x="0" y="30" width="960" height="1" fill="#2bb6a8" opacity="0.5"/>
  <rect x="0" y="389" width="960" height="1" fill="#e8745a" opacity="0.4"/>

  <!-- clapperboard motif -->
  <g transform="translate(46,52)">
    <polygon points="0,16 7.2,2 14.4,16" fill="#e8eef2"/>
    <polygon points="14.4,16 21.6,2 28.8,16" fill="#0e151c"/>
    <polygon points="28.8,16 36,2 43.2,16" fill="#e8eef2"/>
    <polygon points="43.2,16 50.4,2 57.6,16" fill="#0e151c"/>
    <polygon points="57.6,16 64.8,2 72,16" fill="#e8eef2"/>
    <rect x="0" y="16" width="72" height="20" rx="3" fill="#0e151c" stroke="#e8eef2" stroke-width="1.4"/>
    <line x1="70" y1="9" x2="84" y2="1" stroke="#e8eef2" stroke-width="2"/>
  </g>
  <text x="142" y="70" fill="#f2f6f9" font-size="27" font-weight="800" letter-spacing="0.5">Second Take · 再来一条</text>
  <text x="143" y="95" fill="#9fb0bd" font-size="13">把一段不满意的深度思考，重拍成更好的答案</text>

  <!-- card 1: input -->
  <g transform="translate(40,140)">
    <rect width="250" height="200" rx="12" fill="url(#bad)" stroke="#e0584f" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="26" cy="28" r="15" fill="#e0584f"/>
    <text x="26" y="33" text-anchor="middle" fill="#1a0a0a" font-size="14" font-weight="800">1</text>
    <text x="50" y="33" fill="#f4d2d2" font-size="14.5" font-weight="700">待诊断 · 你的深度思考</text>
    <line x1="18" y1="54" x2="232" y2="54" stroke="#e0584f" stroke-width="1" opacity="0.35"/>
    <path d="M22 82 H196" stroke="#ef8b84" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M22 102 H150" stroke="#ef8b84" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <path d="M22 122 H210" stroke="#ef8b84" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <path d="M22 142 H120" stroke="#ef8b84" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
    <circle cx="200" cy="142" r="13" fill="none" stroke="#ef8b84" stroke-width="2.5"/>
    <line x1="195" y1="137" x2="205" y2="147" stroke="#ef8b84" stroke-width="2.5"/>
    <line x1="205" y1="137" x2="195" y2="147" stroke="#ef8b84" stroke-width="2.5"/>
    <text x="20" y="178" fill="#ef8b84" font-size="11">漏项 · 矛盾 · 无据引用</text>
  </g>

  <!-- arrow 1 -->
  <g transform="translate(300,232)" fill="#e8c15a">
    <path d="M0 8 H34 L34 1 L54 9 L34 17 L34 10 H0 Z"/>
  </g>

  <!-- card 2: retake note -->
  <g transform="translate(355,140)">
    <rect width="250" height="200" rx="12" fill="url(#note)" stroke="#e8b84b" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="26" cy="28" r="15" fill="#e8b84b"/>
    <text x="26" y="33" text-anchor="middle" fill="#1a1405" font-size="14" font-weight="800">2</text>
    <text x="50" y="33" fill="#f6e4b0" font-size="14.5" font-weight="700">重拍单 · Retake note</text>
    <line x1="18" y1="54" x2="232" y2="54" stroke="#e8b84b" stroke-width="1" opacity="0.35"/>
    <rect x="72" y="74" width="106" height="92" rx="6" fill="#f3e6c4" opacity="0.96" stroke="#b89a4e" stroke-width="1.2"/>
    <line x1="84" y1="92" x2="166" y2="92" stroke="#8a6d2e" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="108" x2="166" y2="108" stroke="#8a6d2e" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="124" x2="166" y2="124" stroke="#8a6d2e" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="140" x2="140" y2="140" stroke="#8a6d2e" stroke-width="3" stroke-linecap="round"/>
    <path d="M146 150 l5 6 l10 -13" fill="none" stroke="#2bb6a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="178" fill="#e8b84b" font-size="11">可复制 · 粘回原对话即重拍</text>
  </g>

  <!-- arrow 2 -->
  <g transform="translate(615,232)" fill="#e8745a">
    <path d="M0 8 H34 L34 1 L54 9 L34 17 L34 10 H0 Z"/>
  </g>

  <!-- card 3: better answer -->
  <g transform="translate(670,140)">
    <rect width="250" height="200" rx="12" fill="url(#good)" stroke="#2bb6a8" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="26" cy="28" r="15" fill="#2bb6a8"/>
    <text x="26" y="33" text-anchor="middle" fill="#06201d" font-size="14" font-weight="800">3</text>
    <text x="50" y="33" fill="#c9ede7" font-size="14.5" font-weight="700">重拍后 · 更好的答案</text>
    <line x1="18" y1="54" x2="232" y2="54" stroke="#2bb6a8" stroke-width="1" opacity="0.35"/>
    <path d="M22 84 H210" stroke="#bfeae3" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M22 104 H186" stroke="#f0c98a" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M22 124 H214" stroke="#bfeae3" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M22 144 H156" stroke="#f0c98a" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="200" cy="144" r="12" fill="#2bb6a8"/>
    <path d="M194 144 l4 4 l8 -9" fill="none" stroke="#eafbf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="178" fill="#2bb6a8" font-size="11">逻辑 / 全面 / 可行 / 可验证 达标</text>
  </g>

  <!-- film grain -->
  <rect width="960" height="420" filter="url(#grain)" opacity="0.04"/>

  <!-- author watermark -->
  <text x="480" y="409" text-anchor="middle" fill="#7d8a94" font-size="11.5" letter-spacing="1">© flashfrogluo · Second Take — AI 深度思考质检与重拍单生成</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#0e1822"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="72%">
      <stop offset="0" stop-color="#2bb6a8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2bb6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="960" height="470" fill="url(#bg)"/>
  <rect width="960" height="470" fill="url(#glow)"/>
  <rect x="0" y="0" width="960" height="2" fill="#2bb6a8" opacity="0.6"/>

  <!-- title -->
  <text x="50" y="46" fill="#f2f6f9" font-size="25" font-weight="800" letter-spacing="0.5">Second Take · 再来一条</text>
  <!-- explicit "for your AI" pill -->
  <rect x="712" y="28" width="198" height="26" rx="13" fill="#13202b" stroke="#2bb6a8" stroke-width="1.2"/>
  <text x="811" y="45" text-anchor="middle" fill="#7fe0d2" font-size="11.5" font-weight="700">针对你的 AI · For your AI</text>

  <text x="50" y="72" fill="#e7eef4" font-size="14">优化你的 AI 成果：把不满意的回答，重拍成更好的那条</text>
  <text x="50" y="91" fill="#8fa0ad" font-size="11.5">Optimize your AI's output — re-shoot a weak answer into a stronger one</text>
  <line x1="50" y1="104" x2="910" y2="104" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ===== main flow ===== -->
  <!-- node 1: input to improve -->
  <g transform="translate(61,120)">
    <rect width="250" height="158" rx="14" fill="#141d27" stroke="#e0584f" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="0" y="14" width="4" height="130" rx="2" fill="#e0584f"/>
    <circle cx="42" cy="42" r="17" fill="#e0584f"/>
    <text x="42" y="48" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
    <text x="72" y="38" fill="#eef3f7" font-size="15" font-weight="700">待改善的 AI 成果</text>
    <text x="72" y="57" fill="#9fb0bd" font-size="11">Your AI's output to improve</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#e0584f" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" fill="#cdd8e0" font-size="12">AI深度思考过程（CoT）+ 当前回答</text>
    <text x="20" y="126" fill="#8595a3" font-size="12">没达到预期，交来一起诊断</text>
  </g>

  <!-- arrow 1 -->
  <g stroke="#5b6b78" fill="#5b6b78">
    <line x1="318" y1="199" x2="342" y2="199" stroke-width="2"/>
    <path d="M342 194 L352 199 L342 204 Z"/>
  </g>

  <!-- node 2: retake note -->
  <g transform="translate(355,120)">
    <rect width="250" height="158" rx="14" fill="#141d27" stroke="#e8b84b" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="0" y="14" width="4" height="130" rx="2" fill="#e8b84b"/>
    <circle cx="42" cy="42" r="17" fill="#e8b84b"/>
    <text x="42" y="48" text-anchor="middle" fill="#1a1405" font-size="16" font-weight="800">2</text>
    <text x="72" y="38" fill="#eef3f7" font-size="15" font-weight="700">重拍单</text>
    <text x="72" y="57" fill="#9fb0bd" font-size="11">Retake note</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#e8b84b" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" fill="#cdd8e0" font-size="12">诊断问题 + 可复制优化指令</text>
    <text x="20" y="126" fill="#8595a3" font-size="12">粘回原 AI 即重拍</text>
  </g>

  <!-- arrow 2 -->
  <g stroke="#5b6b78" fill="#5b6b78">
    <line x1="612" y1="199" x2="636" y2="199" stroke-width="2"/>
    <path d="M636 194 L646 199 L636 204 Z"/>
  </g>

  <!-- node 3: better output -->
  <g transform="translate(649,120)">
    <rect width="250" height="158" rx="14" fill="#141d27" stroke="#2bb6a8" stroke-width="1.4" filter="url(#shadow)"/>
    <rect x="0" y="14" width="4" height="130" rx="2" fill="#2bb6a8"/>
    <circle cx="42" cy="42" r="17" fill="#2bb6a8"/>
    <text x="42" y="48" text-anchor="middle" fill="#06201d" font-size="16" font-weight="800">3</text>
    <text x="72" y="38" fill="#eef3f7" font-size="15" font-weight="700">更好的 AI 产出</text>
    <text x="72" y="57" fill="#9fb0bd" font-size="11">Better AI output</text>
    <line x1="18" y1="74" x2="232" y2="74" stroke="#2bb6a8" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="104" fill="#cdd8e0" font-size="12">更可靠、更贴合你的需求</text>
    <text x="20" y="126" fill="#8595a3" font-size="12">真正能用，而非堆满术语</text>
  </g>

  <!-- ===== five modes (abbreviated) ===== -->
  <text x="50" y="312" fill="#aebcc8" font-size="12.5" font-weight="700">五种模式 · Five modes</text>
  <line x1="50" y1="322" x2="910" y2="322" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- mode chips -->
  <g transform="translate(50,332)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#e0584f"/>
    <text x="22" y="29" text-anchor="middle" fill="#1a0a0a" font-size="12" font-weight="800">1</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">重拍</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Reshoot</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">主体不成立，整条重写</text>
  </g>
  <g transform="translate(225,332)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#e8b84b"/>
    <text x="22" y="29" text-anchor="middle" fill="#1a1405" font-size="12" font-weight="800">2</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">补拍</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Pick-up</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">主体已成立，定点修</text>
  </g>
  <g transform="translate(400,332)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#2bb6a8"/>
    <text x="22" y="29" text-anchor="middle" fill="#06201d" font-size="12" font-weight="800">3</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">定剪</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Final cut</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">多轮僵持，做取舍</text>
  </g>
  <g transform="translate(575,332)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#e8915a"/>
    <text x="22" y="29" text-anchor="middle" fill="#1a0a04" font-size="12" font-weight="800">4</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">调色</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Color grading</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">主体已优，润色表达</text>
  </g>
  <g transform="translate(750,332)">
    <rect width="161" height="92" rx="10" fill="#121c26" stroke="#243240" stroke-width="1"/>
    <circle cx="22" cy="24" r="12" fill="#6aa9e0"/>
    <text x="22" y="29" text-anchor="middle" fill="#06203a" font-size="12" font-weight="800">5</text>
    <text x="42" y="22" fill="#e6edf2" font-size="13" font-weight="700">包装</text>
    <text x="42" y="40" fill="#8fa0ad" font-size="10">Packaging</text>
    <text x="16" y="68" fill="#b6c2cc" font-size="10.5">交付时，可视化呈现</text>
  </g>

  <!-- author watermark -->
  <text x="480" y="452" text-anchor="middle" fill="#67747f" font-size="11" letter-spacing="1">© flashfrogluo · Second Take</text>
</svg>
